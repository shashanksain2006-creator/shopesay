<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | Shop Easy</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav id="nav"></nav>
<main>
<div class="card narrow"><h1>Create account</h1>
<form id="form" novalidate>
<label for="name">Name</label><input id="name" autocomplete="name">
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="password">Password (min 8 characters)</label><input id="password" type="password" autocomplete="new-password">
<div id="msg" class="msg"></div><button type="submit" id="btn">Register</button></form>
<p>Already have an account? <a href="login.html">Log in</a></p></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/register.js"></script>
</body></html>
