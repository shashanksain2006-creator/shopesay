<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Shop Easy</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav id="nav"></nav>
<main>
<div class="card narrow"><h1>Log in</h1>
<form id="form" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<div id="msg" class="msg"></div><button type="submit" id="btn">Log in</button></form>
<p>No account yet? <a href="register.html">Register</a></p></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/login.js"></script>
</body></html>
